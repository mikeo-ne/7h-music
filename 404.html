<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Track not found | 7H Music Group</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#0a0a0b;--ink:#f4f1ea;--muted:#8f8b83;--gold:#c9a24b;--line:rgba(244,241,234,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;overflow:hidden;position:relative}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(201,162,75,.12),transparent 55%);pointer-events:none}
  .mark{font-size:clamp(150px,34vw,360px);font-weight:900;line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px var(--gold);position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);z-index:0;opacity:.25;user-select:none}
  .inner{position:relative;z-index:1;max-width:600px}
  .logo{display:inline-flex;align-items:baseline;gap:10px;font-weight:900;margin-bottom:34px}
  .logo .m{font-size:26px;border:2px solid var(--ink);padding:3px 8px 5px;border-radius:4px}
  .logo .s{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-size:clamp(34px,7vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:18px 0 16px;line-height:.95}
  p{color:var(--muted);font-size:15px;line-height:1.7;max-width:420px;margin:0 auto 36px}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;padding:16px 30px;border-radius:100px;transition:.35s;text-decoration:none}
  .btn-solid{background:var(--ink);color:#0a0a0b}
  .btn-solid:hover{background:var(--gold)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink)}
  .eq{display:flex;gap:5px;align-items:flex-end;justify-content:center;height:40px;margin:0 auto 30px}
  .eq span{width:5px;background:var(--gold);border-radius:3px;animation:b 1s ease-in-out infinite}
  .eq span:nth-child(1){height:16px;animation-delay:0s}
  .eq span:nth-child(2){height:34px;animation-delay:.15s}
  .eq span:nth-child(3){height:24px;animation-delay:.3s}
  .eq span:nth-child(4){height:38px;animation-delay:.45s}
  .eq span:nth-child(5){height:18px;animation-delay:.6s}
  @keyframes b{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
  <div class="mark">404</div>
  <div class="inner">
    <div class="logo"><span class="m">7H</span><span class="s">Music&nbsp;Group</span></div>
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <span class="tag">Error 404 · Track Not Found</span>
    <h1>This one skipped.</h1>
    <p>The page you're looking for doesn't exist or was moved — but the music never stops. Head back home or press play on the latest.</p>
    <div class="btns">
      <a class="btn btn-solid" href="/">Back Home →</a>
      <a class="btn btn-ghost" href="/#music">Latest Releases</a>
    </div>
  </div>
</body>
</html>
